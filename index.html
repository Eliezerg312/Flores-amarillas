<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flores para mi amorcito.">
    <title>Flores Amarillas</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fuentes elegantes de Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="message-container" id="messageContainer">
        <!-- ========================================================================= -->
        <!-- LÍNEA PARA MODIFICAR: Escribe tu dedicatoria personal entre las etiquetas -->
        <!-- ========================================================================= -->
        <h1 id="romanticMessage">Gracias por estos 10 meses a mi lado, se que hemos tenido problemas y desacuerdos, pero
            nuestro amor es más grande y lo hemos solucionado. Te amo con todo mi corazón, hasta el
            infinito y más allá y aunque sean virtuales te entrego estas flores amarillas ❤️</h1>
    </div>

    <!-- Controles de música -->
    <div class="audio-controls" id="audioControls">
        <!-- ========================================================================= -->
        <!-- LÍNEA PARA MODIFICAR: Reemplaza "cancion.mp3" por el nombre de tu archivo -->
        <!-- ========================================================================= -->
        <audio id="bgMusic" loop>
            <source src="Iris.mp3" type="audio/mpeg">
        </audio>
        <button id="musicToggle">🎵 Reproducir Canción</button>
    </div>

    <canvas id="flowerCanvas"></canvas>

    <script src="script.js"></script>
</body>

</html>
